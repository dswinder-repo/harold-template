# Harold for Hermes Agent. Hermes reads shell hooks only from its profile config (~/.hermes/config.yaml), never from a
# project, so merge this `hooks:` block into that file. Hermes asks once per hook before running it (or start it with
# --accept-hooks). Hermes runs a hook command without a shell, so each one is wrapped in `sh -c`; each does nothing
# unless Hermes runs in a Harold workspace (or HAROLD_ROOT names one), so they are safe in every other project.
#   pre_llm_call         boot. On the first turn of a session its answer {"context": ...} is added to the prompt; on
#                        later turns it adds nothing, or what the last close found unfiled.
#   pre_verify           close, blocking: it fires when the agent changed files in the turn, and {"decision": "block"}
#                        keeps the agent going (at most agent.max_verify_nudges times, default 3).
#   on_session_end       close at the end of every turn (commit and push; cannot block).
#   on_session_finalize  close --final when the session is torn down (/new, quitting), detached.
# Source: NousResearch/hermes-agent, website/docs/user-guide/features/hooks.md (Shell Hooks) and agent/shell_hooks.py.
hooks:
  pre_llm_call:
    - command: >-
        sh -c 'r="${HAROLD_ROOT:-$(git rev-parse --show-toplevel 2>/dev/null || pwd)}";
        [ -x "$r/bin/harold" ] && [ -f "$r/AGENTS.md" ] || { echo "{}"; exit 0; };
        exec "$r/bin/harold" boot --via=hermes'
      timeout: 60
  pre_verify:
    - command: >-
        sh -c 'r="${HAROLD_ROOT:-$(git rev-parse --show-toplevel 2>/dev/null || pwd)}";
        [ -x "$r/bin/harold" ] && [ -f "$r/AGENTS.md" ] || { echo "{}"; exit 0; };
        exec "$r/bin/harold" close --via=hermes'
      timeout: 240
  on_session_end:
    - command: >-
        sh -c 'r="${HAROLD_ROOT:-$(git rev-parse --show-toplevel 2>/dev/null || pwd)}";
        [ -x "$r/bin/harold" ] && [ -f "$r/AGENTS.md" ] || { echo "{}"; exit 0; };
        exec "$r/bin/harold" close --via=hermes'
      timeout: 240
  on_session_finalize:
    - command: >-
        sh -c 'r="${HAROLD_ROOT:-$(git rev-parse --show-toplevel 2>/dev/null || pwd)}";
        [ -x "$r/bin/harold" ] && [ -f "$r/AGENTS.md" ] || { echo "{}"; exit 0; };
        exec "$r/bin/harold" close --final --via=hermes --detach'
      timeout: 10
