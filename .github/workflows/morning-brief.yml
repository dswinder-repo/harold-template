name: Harold morning brief

# OPTIONAL. Writes Steps 1-2 of playbook/core/morning-brief.md to harold/briefs/YYYY-MM-DD.md before
# you sit down, on GitHub's machines (no computer of yours needs to be on), and pushes it. When you
# next say good morning, `bin/harold boot` finds it and Harold shows it instead of re-running those
# steps. Step 3 needs you, so it never runs here. The prompt is harold/brief-prompt.md.
#
# YOUR TIME ZONE, YOUR TIME. GitHub schedules run in UTC only, so this workflow wakes every hour and
# lets `bin/harold brief start` decide. It writes the brief only when it is a weekday in HAROLD_TZ,
# the local time there is at or after HAROLD_BRIEF_TIME, and today's brief does not exist yet; every
# other hour it stops in seconds, before the model step. Daylight saving needs no attention: the gate
# reads the clock in your zone. Set these two repository VARIABLES to your own zone and time
# (Settings → Secrets and variables → Actions → Variables):
#   HAROLD_TZ           your IANA time zone, e.g. America/Chicago, Europe/London, Asia/Singapore
#                       (unset = UTC here, and every run prints a warning saying so)
#   HAROLD_BRIEF_TIME   HH:MM, 24-hour, local time in that zone (unset = 06:30)
# It wakes at 35 minutes past each hour, so the default 06:30 brief starts at about 06:35 (GitHub can
# start scheduled runs a few minutes late). If your brief time is on another minute, or your zone is
# offset by a half hour, move the cron minute to just after your time in UTC.
# If a run fails, the next hourly run tries again, for up to 6 hours after the brief time
# (repository variable HAROLD_BRIEF_WINDOW_HOURS changes that; 0 = no limit).
#
# WHICH AI TOOL WRITES IT, AND HOW IT SIGNS IN. Repository variable HAROLD_AGENT picks the agent (unset = claude):
# claude, codex, cursor, gemini, copilot, grok, kimi, qwen, or custom (any other headless agent CLI, through
# HAROLD_AGENT_CMD). Every agent runs on your subscription if you have one; an API key is only for when you
# don't, and when both secrets are present the subscription is used. The secrets, per agent:
#   claude   CLAUDE_CODE_OAUTH_TOKEN (Pro/Max, from `claude setup-token`) | ANTHROPIC_API_KEY
#            or another provider's coding plan: ANTHROPIC_BASE_URL + ANTHROPIC_AUTH_TOKEN (+ ANTHROPIC_MODEL)
#   codex    CODEX_AUTH_JSON (ChatGPT plan: auth.json of a separate `codex login`) | OPENAI_API_KEY
#   cursor   CURSOR_API_KEY (a User API key from your Cursor account)
#   gemini   GEMINI_OAUTH_CREDS (Google sign-in: ~/.gemini/oauth_creds.json) | GEMINI_API_KEY
#   copilot  COPILOT_GITHUB_TOKEN (fine-grained token with "Copilot Requests"; needs a Copilot plan)
#   grok     GROK_AUTH_JSON (SuperGrok: auth.json of a separate `grok login`) | XAI_API_KEY
#   kimi     KIMI_API_KEY (a Kimi Code key)        qwen  QWEN_CODING_PLAN_KEY (Alibaba Cloud Coding Plan)
#   custom   HAROLD_AGENT_CMD, optional HAROLD_AGENT_INSTALL and HAROLD_AGENT_SECRETS (variables)
# Optional variables: HAROLD_AGENT_MODEL (a model name, any agent), HAROLD_AGENT_BASE_URL (kimi, qwen).
# README.md → "Scheduled jobs in the cloud" has the one-time commands and what is not yet tested.
# .github/actions/harold-agent runs whichever you pick; the gate, the prompt
# (harold/brief-prompt.md) and the commit/push step are the same for all.
#
# ONE AT A TIME FOR SIGN-IN FILES. Codex, Gemini CLI and Grok keep a subscription sign-in in a file that the
# agent renews by itself (a Codex renewal retires the previous token). The job keeps the renewed copy in the
# Actions cache, encrypted (bin/harold-agent-auth), and with those agents this workflow and housekeeping.yml
# share one concurrency group, so two runs never renew the same sign-in at once.
#
# To enable:
#   1. Add the repository secret for your agent (above). With no HAROLD_AGENT variable that is
#      CLAUDE_CODE_OAUTH_TOKEN (subscription) or ANTHROPIC_API_KEY.
#   2. Set the two variables above (and HAROLD_AGENT if you are not using Claude Code).
#   3. Optional: a repository secret NTFY_TOPIC for a phone push (ntfy app) when the brief lands.
#   4. Try it: Actions → "Harold morning brief" → Run workflow, with force=true and dry_run=true first.
#
# Cost: about 720 short runs a month. On a private repository each run counts as at least one Actions
# minute (the Free plan includes 2,000 a month). To use fewer, narrow the cron hours to your morning in
# UTC, wide enough to cover both daylight-saving offsets, e.g. '35 11-14 * * *' for 06:30 in Chicago.
#
# Prefer a Claude Code routine? Delete this file and create a routine whose prompt is the contents of
# harold/brief-prompt.md, scheduled for your brief time. Its own schedule is the clock; the same gate
# still keeps it to weekdays and one brief a day.
on:
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Run even on a weekend, outside the brief time, or when today's brief exists (true/false)"
        default: "false"
      dry_run:
        description: "Gate and context only, no model call (true/false)"
        default: "false"

permissions:
  contents: write

concurrency:
  # Codex, Gemini CLI and Grok on a subscription: shared with housekeeping.yml (see above).
  group: ${{ contains(fromJSON('["codex","gemini","grok"]'), vars.HAROLD_AGENT) && 'harold-agent-signin' || 'morning-brief' }}
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAROLD_TZ: ${{ vars.HAROLD_TZ }}
      HAROLD_BRIEF_TIME: ${{ vars.HAROLD_BRIEF_TIME }}
      HAROLD_BRIEF_WINDOW_HOURS: ${{ vars.HAROLD_BRIEF_WINDOW_HOURS }}
      HAROLD_SESSION_ID: github-actions-${{ github.run_id }}
      HAROLD_AGENT: ${{ vars.HAROLD_AGENT || 'claude' }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      FORCE: ${{ inputs.force }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # Cheap: the runner's preinstalled Node, no install, no model. Not due → one line and done.
      - name: Is the brief due? (weekday in HAROLD_TZ, at or after HAROLD_BRIEF_TIME, no brief yet)
        id: gate
        run: |
          if [ "$FORCE" = "true" ]; then bin/harold brief start --force < /dev/null; else bin/harold brief start < /dev/null; fi

      - name: Prepare the prompt
        if: ${{ steps.gate.outputs.due == 'true' && env.DRY_RUN != 'true' }}
        run: |
          {
            echo "Note for this run: the workflow runs bin/harold brief finish again after you, outside any sandbox. If brief finish fails only because git or the network is not reachable from where you run, stop there: the brief file is what matters."
            echo
            cat harold/brief-prompt.md
          } > "$RUNNER_TEMP/brief-prompt.md"

      - name: Write the brief with the agent HAROLD_AGENT names (morning-brief.md Steps 1-2, analyst.md standard)
        if: ${{ steps.gate.outputs.due == 'true' && env.DRY_RUN != 'true' }}
        uses: ./.github/actions/harold-agent
        with:
          agent: ${{ env.HAROLD_AGENT }}
          model: ${{ vars.HAROLD_AGENT_MODEL }}
          base-url: ${{ vars.HAROLD_AGENT_BASE_URL }}
          prompt-file: ${{ runner.temp }}/brief-prompt.md
          log-file: /tmp/brief-run.log
          max-turns: 80
          commands: "bin/harold,cat,date"
          # Subscription first; the API key is for when you have none (README.md, Scheduled jobs in the cloud).
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          anthropic-base-url: ${{ secrets.ANTHROPIC_BASE_URL }}
          anthropic-auth-token: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          anthropic-model: ${{ secrets.ANTHROPIC_MODEL || vars.ANTHROPIC_MODEL }}
          codex-auth-json: ${{ secrets.CODEX_AUTH_JSON }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          cursor-api-key: ${{ secrets.CURSOR_API_KEY }}
          gemini-oauth-creds: ${{ secrets.GEMINI_OAUTH_CREDS }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          copilot-github-token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          grok-auth-json: ${{ secrets.GROK_AUTH_JSON }}
          xai-api-key: ${{ secrets.XAI_API_KEY }}
          kimi-api-key: ${{ secrets.KIMI_API_KEY }}
          qwen-coding-plan-key: ${{ secrets.QWEN_CODING_PLAN_KEY }}
          custom-command: ${{ vars.HAROLD_AGENT_CMD }}
          custom-install: ${{ vars.HAROLD_AGENT_INSTALL }}
          custom-secrets: ${{ vars.HAROLD_AGENT_SECRETS }}
          # Only a custom agent that names secrets gets them, and only the ones it names (bin/harold-agent-auth).
          all-secrets: ${{ vars.HAROLD_AGENT == 'custom' && vars.HAROLD_AGENT_SECRETS != '' && toJSON(secrets) || '' }}

      - name: Finish (commit only the brief paths, push) and notify
        if: ${{ steps.gate.outputs.due == 'true' && env.DRY_RUN != 'true' }}
        run: |
          bin/harold brief finish
          bin/harold brief notify

      - name: Say it failed
        if: ${{ failure() }}
        run: bin/harold brief notify --status=failed --message="The morning brief job failed. Harold will run the brief live when you say good morning." || true
