name: Harold morning brief

# OPTIONAL. Writes Steps 1-2 of playbook/core/morning-brief.md to harold/briefs/YYYY-MM-DD.md before
# you sit down, on GitHub's machines (no computer of yours needs to be on), and pushes it. When you
# next say good morning, `bin/harold boot` finds it and Harold shows it instead of re-running those
# steps. Step 3 needs you, so it never runs here. The prompt is harold/brief-prompt.md.
#
# YOUR TIME ZONE, YOUR TIME. GitHub schedules run in UTC only, so this workflow wakes every hour and
# lets `bin/harold brief start` decide. It writes the brief only when it is a weekday in HAROLD_TZ,
# the local time there is at or after HAROLD_BRIEF_TIME, and today's brief does not exist yet; every
# other hour it stops in seconds, before the model step. Daylight saving needs no attention: the gate
# reads the clock in your zone. Set these two repository VARIABLES to your own zone and time
# (Settings → Secrets and variables → Actions → Variables):
#   HAROLD_TZ           your IANA time zone, e.g. America/Chicago, Europe/London, Asia/Singapore
#                       (unset = UTC here, and every run prints a warning saying so)
#   HAROLD_BRIEF_TIME   HH:MM, 24-hour, local time in that zone (unset = 06:30)
# It wakes at 35 minutes past each hour, so the default 06:30 brief starts at about 06:35 (GitHub can
# start scheduled runs a few minutes late). If your brief time is on another minute, or your zone is
# offset by a half hour, move the cron minute to just after your time in UTC.
# If a run fails, the next hourly run tries again, for up to 6 hours after the brief time
# (repository variable HAROLD_BRIEF_WINDOW_HOURS changes that; 0 = no limit).
#
# To enable:
#   1. Add ONE repository secret: CLAUDE_CODE_OAUTH_TOKEN (run `claude setup-token`; uses your Claude
#      subscription) or ANTHROPIC_API_KEY (pay as you go).
#   2. Set the two variables above.
#   3. Optional: a repository secret NTFY_TOPIC for a phone push (ntfy app) when the brief lands.
#   4. Try it: Actions → "Harold morning brief" → Run workflow, with force=true and dry_run=true first.
#
# Cost: about 720 short runs a month. On a private repository each run counts as at least one Actions
# minute (the Free plan includes 2,000 a month). To use fewer, narrow the cron hours to your morning in
# UTC, wide enough to cover both daylight-saving offsets, e.g. '35 11-14 * * *' for 06:30 in Chicago.
#
# Prefer a Claude Code routine? Delete this file and create a routine whose prompt is the contents of
# harold/brief-prompt.md, scheduled for your brief time. Its own schedule is the clock; the same gate
# still keeps it to weekdays and one brief a day.
on:
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Run even on a weekend, outside the brief time, or when today's brief exists (true/false)"
        default: "false"
      dry_run:
        description: "Gate and context only, no model call (true/false)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAROLD_TZ: ${{ vars.HAROLD_TZ }}
      HAROLD_BRIEF_TIME: ${{ vars.HAROLD_BRIEF_TIME }}
      HAROLD_BRIEF_WINDOW_HOURS: ${{ vars.HAROLD_BRIEF_WINDOW_HOURS }}
      HAROLD_SESSION_ID: github-actions-${{ github.run_id }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      FORCE: ${{ inputs.force }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # Cheap: the runner's preinstalled Node, no install, no model. Not due → one line and done.
      - name: Is the brief due? (weekday in HAROLD_TZ, at or after HAROLD_BRIEF_TIME, no brief yet)
        id: gate
        run: |
          if [ "$FORCE" = "true" ]; then bin/harold brief start --force < /dev/null; else bin/harold brief start < /dev/null; fi

      - name: Require model credentials
        if: ${{ steps.gate.outputs.due == 'true' && env.DRY_RUN != 'true' }}
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$OAUTH" ] && [ -z "$APIKEY" ]; then
            echo "::error::No model credential. Add repository secret CLAUDE_CODE_OAUTH_TOKEN (from 'claude setup-token') or ANTHROPIC_API_KEY."
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: ${{ steps.gate.outputs.due == 'true' && env.DRY_RUN != 'true' }}
        with: { node-version: 22 }

      - name: Write the brief (morning-brief.md Steps 1-2, analyst.md standard)
        if: ${{ steps.gate.outputs.due == 'true' && env.DRY_RUN != 'true' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          claude -p "$(cat harold/brief-prompt.md)" \
            --output-format text \
            --max-turns 80 \
            --permission-mode acceptEdits \
            --allowedTools "Read,Glob,Grep,Write,Edit,WebSearch,WebFetch,Bash(bin/harold *),Bash(cat *),Bash(date *)" \
            --strict-mcp-config --mcp-config '{"mcpServers":{}}' > /tmp/brief-run.log 2>&1 || { tail -40 /tmp/brief-run.log; echo "::error::brief run failed"; exit 1; }
          tail -20 /tmp/brief-run.log

      - name: Finish (commit only the brief paths, push) and notify
        if: ${{ steps.gate.outputs.due == 'true' && env.DRY_RUN != 'true' }}
        run: |
          bin/harold brief finish
          bin/harold brief notify

      - name: Say it failed
        if: ${{ failure() }}
        run: bin/harold brief notify --status=failed --message="The morning brief job failed. Harold will run the brief live when you say good morning." || true
