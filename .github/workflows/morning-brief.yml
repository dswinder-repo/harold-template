name: Harold morning brief

# OPTIONAL. Writes Steps 1-2 of playbook/core/morning-brief.md to harold/briefs/YYYY-MM-DD.md before
# you sit down, on GitHub's machines (no computer of yours needs to be on), and pushes it. When you
# next say good morning, `bin/harold boot` finds it and Harold shows it instead of re-running those
# steps. Step 3 needs you, so it never runs here. The prompt is harold/brief-prompt.md.
#
# YOUR TIME ZONE, YOUR TIME. GitHub schedules run in UTC only, so this workflow wakes every hour and
# lets `bin/harold brief start` decide. It writes the brief only when it is a weekday in HAROLD_TZ,
# the local time there is at or after HAROLD_BRIEF_TIME, and today's brief does not exist yet; every
# other hour it stops in seconds, before the model step. Daylight saving needs no attention: the gate
# reads the clock in your zone. Set these two repository VARIABLES to your own zone and time
# (Settings → Secrets and variables → Actions → Variables):
#   HAROLD_TZ           your IANA time zone, e.g. America/Chicago, Europe/London, Asia/Singapore
#                       (unset = UTC here, and every run prints a warning saying so)
#   HAROLD_BRIEF_TIME   HH:MM, 24-hour, local time in that zone (unset = 06:30)
# It wakes at 35 minutes past each hour, so the default 06:30 brief starts at about 06:35 (GitHub can
# start scheduled runs a few minutes late). If your brief time is on another minute, or your zone is
# offset by a half hour, move the cron minute to just after your time in UTC.
# If a run fails, the next hourly run tries again, for up to 6 hours after the brief time
# (repository variable HAROLD_BRIEF_WINDOW_HOURS changes that; 0 = no limit).
#
# WHICH AI TOOL WRITES IT, AND HOW IT SIGNS IN. Repository variable HAROLD_AGENT picks the agent; unset =
# claude. Each agent runs on your subscription if you have one; an API key is only for when you don't. If
# both secrets are present, the subscription is used. README.md → "Scheduled jobs in the cloud" has the
# one-time commands.
#   claude   Claude Code (`claude -p`).
#            With a subscription (Pro, Max): secret CLAUDE_CODE_OAUTH_TOKEN, from `claude setup-token`.
#            Without: secret ANTHROPIC_API_KEY (pay as you go).
#   codex    Codex (`codex exec`, workspace-write sandbox, live web search).
#            With a subscription (ChatGPT Plus, Pro, Business...): secret CODEX_AUTH_JSON, the auth.json a
#            separate `codex login` writes. Codex renews that sign-in by itself and each renewal replaces it,
#            so the job keeps the renewed copy in the Actions cache, encrypted (bin/harold-codex-auth).
#            Without: secret OPENAI_API_KEY (pay as you go), through the official openai/codex-action.
#   cursor   Cursor's headless CLI (`agent -p --force`). Secret: CURSOR_API_KEY, a User API key from your
#            Cursor account (dashboard → Integrations). Cursor has no other headless sign-in, so this one key
#            serves both cases.
#   Optional variable HAROLD_AGENT_MODEL passes a model name to codex or cursor (claude ignores it).
#   The gate, the prompt (harold/brief-prompt.md) and the commit/push step are the same for all three.
#
# ONE AT A TIME FOR CODEX. A Codex sign-in renewal retires the previous refresh token, so two runs must not
# renew it at once. With HAROLD_AGENT=codex this workflow and housekeeping.yml share one concurrency group.
#
# To enable:
#   1. Add the repository secret for your agent (above). With no HAROLD_AGENT variable that is
#      CLAUDE_CODE_OAUTH_TOKEN (subscription) or ANTHROPIC_API_KEY.
#   2. Set the two variables above (and HAROLD_AGENT if you are not using Claude Code).
#   3. Optional: a repository secret NTFY_TOPIC for a phone push (ntfy app) when the brief lands.
#   4. Try it: Actions → "Harold morning brief" → Run workflow, with force=true and dry_run=true first.
#
# Cost: about 720 short runs a month. On a private repository each run counts as at least one Actions
# minute (the Free plan includes 2,000 a month). To use fewer, narrow the cron hours to your morning in
# UTC, wide enough to cover both daylight-saving offsets, e.g. '35 11-14 * * *' for 06:30 in Chicago.
#
# Prefer a Claude Code routine? Delete this file and create a routine whose prompt is the contents of
# harold/brief-prompt.md, scheduled for your brief time. Its own schedule is the clock; the same gate
# still keeps it to weekdays and one brief a day.
on:
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Run even on a weekend, outside the brief time, or when today's brief exists (true/false)"
        default: "false"
      dry_run:
        description: "Gate and context only, no model call (true/false)"
        default: "false"

permissions:
  contents: write

concurrency:
  # Codex: shared with housekeeping.yml, so only one run at a time can renew the sign-in (see above).
  group: ${{ vars.HAROLD_AGENT == 'codex' && 'harold-codex-signin' || 'morning-brief' }}
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAROLD_TZ: ${{ vars.HAROLD_TZ }}
      HAROLD_BRIEF_TIME: ${{ vars.HAROLD_BRIEF_TIME }}
      HAROLD_BRIEF_WINDOW_HOURS: ${{ vars.HAROLD_BRIEF_WINDOW_HOURS }}
      HAROLD_SESSION_ID: github-actions-${{ github.run_id }}
      HAROLD_AGENT: ${{ vars.HAROLD_AGENT || 'claude' }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      FORCE: ${{ inputs.force }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # Cheap: the runner's preinstalled Node, no install, no model. Not due → one line and done.
      - name: Is the brief due? (weekday in HAROLD_TZ, at or after HAROLD_BRIEF_TIME, no brief yet)
        id: gate
        run: |
          if [ "$FORCE" = "true" ]; then bin/harold brief start --force < /dev/null; else bin/harold brief start < /dev/null; fi

      - name: Require model credentials (for the agent HAROLD_AGENT names; the subscription first)
        id: creds
        if: ${{ steps.gate.outputs.due == 'true' && env.DRY_RUN != 'true' }}
        env:
          CLAUDE_SUB: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CODEX_SUB: ${{ secrets.CODEX_AUTH_JSON }}
          CODEX_KEY: ${{ secrets.OPENAI_API_KEY }}
          CURSOR_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          case "$HAROLD_AGENT" in
            claude) sub="$CLAUDE_SUB"; key="$CLAUDE_KEY"
                    how="With a Claude subscription: run 'claude setup-token' and add the token as repository secret CLAUDE_CODE_OAUTH_TOKEN. Without one: add ANTHROPIC_API_KEY." ;;
            codex)  sub="$CODEX_SUB"; key="$CODEX_KEY"
                    how="With a ChatGPT subscription: sign in once with 'codex login' into a separate folder and add that auth.json as repository secret CODEX_AUTH_JSON (README.md, Scheduled jobs in the cloud). Without one: add OPENAI_API_KEY." ;;
            cursor) sub="$CURSOR_KEY"; key=""
                    how="Add repository secret CURSOR_API_KEY, a User API key from your Cursor account (cursor.com/dashboard/integrations)." ;;
            *) echo "::error::Repository variable HAROLD_AGENT is '$HAROLD_AGENT'. Use claude, codex or cursor (or delete it for claude)."; exit 1 ;;
          esac
          if [ -n "$sub" ]; then auth=subscription; elif [ -n "$key" ]; then auth=api-key
          else echo "::error::No model credential for $HAROLD_AGENT. $how"; exit 1; fi
          echo "auth=$auth" >> "$GITHUB_OUTPUT"
          echo "Agent: $HAROLD_AGENT, signed in with $([ "$auth" = subscription ] && echo 'your subscription' || echo 'an API key')"

      - uses: actions/setup-node@v4
        if: ${{ steps.gate.outputs.due == 'true' && env.DRY_RUN != 'true' }}
        with: { node-version: 22 }

      # One prompt for every agent, with one note in front. A sandbox may keep the agent away from git and the
      # network, so the agent's own `brief finish` can fail; the Finish step below runs it again outside the
      # agent either way (it is a no-op once the brief is pushed).
      - name: Prepare the prompt
        if: ${{ steps.gate.outputs.due == 'true' && env.DRY_RUN != 'true' }}
        run: |
          {
            echo "Note for this run: the workflow runs bin/harold brief finish again after you, outside any sandbox. If brief finish fails only because git or the network is not reachable from where you run, stop there: the brief file is what matters."
            echo
            cat harold/brief-prompt.md
          } > "$RUNNER_TEMP/brief-prompt.md"

      - name: Write the brief with Claude Code (morning-brief.md Steps 1-2, analyst.md standard)
        if: ${{ env.HAROLD_AGENT == 'claude' && steps.creds.outputs.auth != '' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Claude Code uses ANTHROPIC_API_KEY ahead of the subscription token when both are set, so drop the key
          # whenever the subscription token is there.
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then unset ANTHROPIC_API_KEY; fi
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          claude -p "$(cat "$RUNNER_TEMP/brief-prompt.md")" \
            --output-format text \
            --max-turns 80 \
            --permission-mode acceptEdits \
            --allowedTools "Read,Glob,Grep,Write,Edit,WebSearch,WebFetch,Bash(bin/harold *),Bash(cat *),Bash(date *)" \
            --strict-mcp-config --mcp-config '{"mcpServers":{}}' > /tmp/brief-run.log 2>&1 || { tail -40 /tmp/brief-run.log; echo "::error::brief run failed"; exit 1; }
          tail -20 /tmp/brief-run.log

      # Codex on a ChatGPT subscription: restore the newest copy of the sign-in, run, save a renewed copy.
      - name: Restore the Codex sign-in (cached renewal)
        if: ${{ env.HAROLD_AGENT == 'codex' && steps.creds.outputs.auth == 'subscription' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/codex-auth.enc
          key: harold-codex-auth-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: harold-codex-auth-

      - name: Write the brief with Codex (subscription)
        id: codex_sub
        if: ${{ env.HAROLD_AGENT == 'codex' && steps.creds.outputs.auth == 'subscription' }}
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          MODEL: ${{ vars.HAROLD_AGENT_MODEL }}
        run: |
          bin/harold-codex-auth restore
          npm install -g @openai/codex >/dev/null 2>&1
          # Codex's Linux sandbox (bubblewrap) needs unprivileged user namespaces, which newer Ubuntu runner
          # images restrict; the official openai/codex-action makes the same two settings.
          [ "$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || echo 1)" = 1 ] || sudo sysctl -w kernel.unprivileged_userns_clone=1
          [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 0 ] || sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          codex exec --skip-git-repo-check --sandbox workspace-write -c 'web_search="live"' ${MODEL:+--model "$MODEL"} - < "$RUNNER_TEMP/brief-prompt.md" > /tmp/brief-run.log 2>&1 || { tail -40 /tmp/brief-run.log; echo "::error::brief run failed"; exit 1; }
          tail -20 /tmp/brief-run.log

      - name: Keep a renewed Codex sign-in for the next run (encrypted)
        id: codex_save
        if: ${{ always() && env.HAROLD_AGENT == 'codex' && steps.creds.outputs.auth == 'subscription' }}
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: bin/harold-codex-auth save

      - name: Save the renewed Codex sign-in to the cache
        if: ${{ always() && steps.codex_save.outputs.changed == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/codex-auth.enc
          key: harold-codex-auth-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Write the brief with Codex (API key)
        if: ${{ env.HAROLD_AGENT == 'codex' && steps.creds.outputs.auth == 'api-key' }}
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/brief-prompt.md
          sandbox: workspace-write
          model: ${{ vars.HAROLD_AGENT_MODEL }}
          codex-args: '["-c", "web_search=\"live\""]'

      - name: Write the brief with Cursor
        if: ${{ env.HAROLD_AGENT == 'cursor' && steps.creds.outputs.auth != '' }}
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          MODEL: ${{ vars.HAROLD_AGENT_MODEL }}
        run: |
          curl https://cursor.com/install -fsS | bash >/dev/null 2>&1
          export PATH="$HOME/.cursor/bin:$HOME/.local/bin:$PATH"
          agent -p --force --trust --output-format text ${MODEL:+--model "$MODEL"} "$(cat "$RUNNER_TEMP/brief-prompt.md")" > /tmp/brief-run.log 2>&1 || { tail -40 /tmp/brief-run.log; echo "::error::brief run failed"; exit 1; }
          tail -20 /tmp/brief-run.log

      - name: Finish (commit only the brief paths, push) and notify
        if: ${{ steps.gate.outputs.due == 'true' && env.DRY_RUN != 'true' }}
        run: |
          bin/harold brief finish
          bin/harold brief notify

      - name: Say it failed
        if: ${{ failure() }}
        run: bin/harold brief notify --status=failed --message="The morning brief job failed. Harold will run the brief live when you say good morning." || true
